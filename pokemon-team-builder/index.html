<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Look Up — Dex & Team Builder</title>
    <meta name="description" content="Browse all 1,025 Pokémon by type, generation and base stats, then build a team of six and check its type coverage, weaknesses and moves.">
    <link rel="preload" href="/dex.json" as="fetch" crossorigin>
    <script>
      try {
        const stored = JSON.parse(localStorage.getItem('pokemon-theme') || '{}');
        const theme = stored?.state?.theme || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
