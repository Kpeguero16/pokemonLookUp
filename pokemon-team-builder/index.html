<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Look Up</title>
    <!-- Apply dark class before React renders to prevent flash of unstyled content -->
    <script>
      try {
        const stored = JSON.parse(localStorage.getItem('pokemon-theme') || '{}');
        if (stored?.state?.isDark) {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
